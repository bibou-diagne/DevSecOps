name: Pipeline DevSecOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Maven
        run: mvn clean install

      - name: Analyse SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Scan Trivy - dépendances (SCA)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

      - name: Build image Docker
        run: docker build -t gestion-cotisations:${{ github.sha }} .

      - name: Scan Trivy - image Docker
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: gestion-cotisations:${{ github.sha }}
          severity: CRITICAL,HIGH
          exit-code: 1
      - name: Scan Checkov - manifests Kubernetes
        uses: bridgecrewio/checkov-action@master
        with:
          directory: k8s/
          framework: kubernetes
          soft_fail: false
          skip_check: CKV_K8S_15,CKV_K8S_20,CKV_K8S_22,CKV_K8S_23,CKV_K8S_29,CKV_K8S_30,CKV_K8S_31,CKV_K8S_35,CKV_K8S_40,CKV_K8S_43,CKV2_K8S_5,CKV2_K8S_6,CKV_K8S_14,CKV_K8S_25
      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image vers Docker Hub
        run: |
          docker tag gestion-cotisations:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/gestion-cotisations:${{ github.sha }}
          docker tag gestion-cotisations:${{ github.sha }} ${{ secrets.DOCKERHUB_USERNAME }}/gestion-cotisations:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gestion-cotisations:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/gestion-cotisations:latest
      - name: Mettre à jour le tag d'image dans le manifeste K8s
        run: |
          sed -i "s|image: .*/gestion-cotisations:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/gestion-cotisations:${{ github.sha }}|" k8s/app.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/app.yaml
          git commit -m "Mise à jour image vers ${{ github.sha }} [skip ci]" || echo "Aucun changement à committer"
          git push