apiVersion: apps/v1
kind: Deployment
metadata:
  name: gestion-cotisations
  namespace: cotisations
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gestion-cotisations
  template:
    metadata:
      labels:
        app: gestion-cotisations
    spec:
      automountServiceAccountToken: false
      containers:
        - name: gestion-cotisations
          image: biboudiagne/gestion-cotisations:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          securityContext:
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: gestion-cotisations
  namespace: cotisations
spec:
  selector:
    app: gestion-cotisations
  ports:
    - port: 8080
      targetPort: 8080
  type: ClusterIP