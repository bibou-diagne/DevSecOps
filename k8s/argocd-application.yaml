apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gestion-cotisations
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/bibou-diagne/DevSecOps.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: cotisations
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true